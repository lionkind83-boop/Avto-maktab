name: Avtomaktab checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m py_compile server.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run isolated smoke tests
        env:
          DATABASE_URL: ""
          REQUIRE_POSTGRES: "0"
          HTTPS_ONLY: "0"
        run: python -m unittest discover -s tests -v
      - name: Validate container build
        run: docker build -t avtomaktab:ci .
